kind = "mobile"
previewPath = "/"
title = "Drop & Sell"
description = "A Baguio City-exclusive mobile marketplace where sellers list items for pickup at physical drop-off hubs, and buyers can browse, reserve, and purchase items once confirmed dropped. Features Supabase auth, real-time updates, push notifications, and role-based access for buyers, sellers, hub admins, and super admins."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
